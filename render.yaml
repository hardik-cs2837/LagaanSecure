# Render Blueprint - Lagaan Secure
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: lagaan-secure
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lagaan-secure-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: lagaan-secure-db
    plan: free
    region: oregon
    databaseName: lagaansecure
